<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattente — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="home-page">
    <header class="app-header">
      <a class="brand" href="/" data-nav="home">Lattente</a>
      <nav class="header-nav" aria-label="Principal">
        <a href="/menu" data-nav="menu">Menú</a>
        <a href="/orders" data-nav="orders">Pedido</a>
        <a href="/feedback" data-nav="feedback">Feedback</a>
      </nav>
      <form class="hero-search" data-search role="search">
        <label class="hero-search__field">
          <span class="hero-search__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <circle cx="10.5" cy="10.5" r="6.25" stroke="currentColor" stroke-width="1.75" />
              <path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            </svg>
          </span>
          <input
            type="search"
            name="q"
            placeholder="Buscar productos"
            aria-label="Buscar productos"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button type="submit" class="hero-search__submit" aria-label="Buscar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
              <path d="M5 12h12M13 7l5 5-5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </label>
      </form>
      <div class="header-actions">
        <button class="cart-btn" type="button" data-open-cart aria-label="Carrito">
          🛒
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Lattente</h1>
        <p class="hero-copy">
          Bienvenid@ a la página oficial de Lattente. Contamos con una gran
          variedad de productos de tu agrado listos a un solo click.
        </p>
        <a class="hero-link" href="/menu">Menú principal ›</a>
      </div>
    </section>

    <div class="cart-drawer" data-cart-drawer>
      <div class="cart-backdrop"></div>
      <aside class="cart-panel" aria-label="Carrito">
        <div>
          <h2>Tu pedido</h2>
          <button type="button" data-close-cart class="btn" style="width:auto;margin-top:0.5rem;padding:0.4rem 0.9rem">
            Cerrar
          </button>
        </div>
        <div class="cart-list" data-cart-list></div>
        <div>
          <div class="cart-total">
            <span>Total</span>
            <span data-cart-total>0,00 Bs.</span>
          </div>
          <a class="btn" href="/orders">Ir a Pedido</a>
        </div>
      </aside>
    </div>

    <script src="/js/cart.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
