<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattente — Café, desayunos y algo más</title>
    <meta
      name="description"
      content="Conocé el menú de Lattente y encontrá tu café, chocolate o bebida favorita. Hacé tu pedido fácil y rápido."
    />
    <link rel="canonical" href="https://lattente.2jsdev.me/" />
    <link rel="icon" type="image/png" href="/images/lattente-coffee-emblem.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_BO" />
    <meta property="og:site_name" content="Lattente" />
    <meta property="og:title" content="Lattente — Café, desayunos y algo más" />
    <meta
      property="og:description"
      content="Conocé el menú de Lattente y encontrá tu café, chocolate o bebida favorita. Hacé tu pedido fácil y rápido."
    />
    <meta property="og:url" content="https://lattente.2jsdev.me/" />
    <meta property="og:image" content="https://lattente.2jsdev.me/images/lattente-og.jpg" />
    <meta property="og:image:secure_url" content="https://lattente.2jsdev.me/images/lattente-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Lattente sobre una taza de café" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lattente — Café, desayunos y algo más" />
    <meta
      name="twitter:description"
      content="Conocé el menú de Lattente y encontrá tu café, chocolate o bebida favorita. Hacé tu pedido fácil y rápido."
    />
    <meta name="twitter:image" content="https://lattente.2jsdev.me/images/lattente-og.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Lattente",
        "url": "https://lattente.2jsdev.me/",
        "image": [
          "https://lattente.2jsdev.me/images/lattente-og.jpg",
          "https://lattente.2jsdev.me/images/lattente-coffee-emblem.png"
        ],
        "email": "hola@lattente.bo",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. América 763",
          "addressLocality": "Cochabamba",
          "addressCountry": "BO"
        },
        "hasMenu": "https://lattente.2jsdev.me/#menu"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/site-footer.css" />
  </head>
  <body class="home-page">
    <header class="app-header">
      <a class="brand" href="/" data-nav="home" aria-label="Lattente — inicio">
        <img src="/images/lattente-logo.png" alt="Lattente" />
      </a>
      <nav class="header-nav" aria-label="Principal">
        <a href="#menu" data-nav="menu">Menú</a>
        <a href="/orders" data-nav="orders">Pedido</a>
        <a href="/feedback" data-nav="feedback">Feedback</a>
      </nav>
      <form class="hero-search" data-search role="search">
        <label class="hero-search__field">
          <span class="hero-search__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <circle cx="10.5" cy="10.5" r="6.25" stroke="currentColor" stroke-width="1.75" />
              <path d="M15.2 15.2 20 20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
            </svg>
          </span>
          <input
            type="search"
            name="q"
            placeholder="Buscar productos o categorías"
            aria-label="Buscar productos o categorías"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button type="submit" class="hero-search__submit" aria-label="Buscar">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
              <path d="M5 12h12M13 7l5 5-5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </label>
      </form>
      <div class="header-actions">
        <button class="cart-btn" type="button" data-open-cart aria-label="Carrito">
          🛒
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </header>

    <section class="hero">
      <video
        class="hero-video is-active"
        data-hero-video
        autoplay
        muted
        playsinline
        preload="auto"
        poster="/images/hero-coffee-poster.jpg"
        aria-hidden="true"
        tabindex="-1"
      >
        <source src="/videos/hero-coffee.mp4" type="video/mp4" />
      </video>
      <video
        class="hero-video"
        data-hero-video
        muted
        playsinline
        preload="auto"
        poster="/images/hero-coffee-poster.jpg"
        aria-hidden="true"
        tabindex="-1"
      >
        <source src="/videos/hero-coffee.mp4" type="video/mp4" />
      </video>
      <div class="hero-content">
        <h1 class="hero-title">
          <img class="hero-logo" src="/images/lattente-logo.png" alt="Lattente" fetchpriority="high" />
        </h1>
        <p class="hero-copy">
          Bienvenid@ a la página oficial de Lattente. Contamos con una gran
          variedad de productos de tu agrado listos a un solo click.
        </p>
        <a class="hero-link" href="#menu">Menú principal ›</a>
      </div>
    </section>

    <section class="menu-shell" id="menu">
      <div class="menu-toolbar">
        <div>
          <h2>Menú</h2>
          <p class="menu-lead">Elige una categoría para ver sus productos y agregarlos al pedido.</p>
        </div>
      </div>

      <div data-menu-browse>
        <div class="menu-filters" data-menu-filters role="group" aria-label="Filtrar menú"></div>
        <div class="category-grid" data-category-grid></div>
      </div>

      <div class="category-detail" data-category-detail hidden>
        <button type="button" class="back-cats" data-back-categories>← Todas las categorías</button>
        <div class="section-title-row">
          <h3 class="section-title serif" data-detail-title></h3>
        </div>
        <hr class="section-rule" />
        <div class="menu-detail">
          <div class="menu-list" data-detail-list></div>
          <figure class="menu-visual">
            <img data-detail-image src="" alt="" />
          </figure>
        </div>
      </div>
    </section>

    <div class="cart-drawer" data-cart-drawer>
      <div class="cart-backdrop"></div>
      <aside class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title" tabindex="-1">
        <div class="cart-panel__head">
          <h2 id="cart-title">Carrito</h2>
          <button type="button" data-close-cart class="cart-close" aria-label="Cerrar carrito">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="cart-list" data-cart-list></div>
        <div class="cart-panel__footer">
          <div class="cart-total" data-cart-total-row hidden>
            <span>Total</span>
            <span data-cart-total>0,00 Bs.</span>
          </div>
          <a class="btn" data-cart-action href="/#menu">Explorar menú</a>
        </div>
      </aside>
    </div>

    <script src="/js/cart.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/product-media.js"></script>
    <script src="/js/menu.js"></script>
    <script src="/js/site-footer.js"></script>
  </body>
</html>
