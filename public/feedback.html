<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattente — Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/site-footer.css" />
  </head>
  <body class="feedback-page">
    <header class="app-header">
      <a class="brand" href="/" data-nav="home" aria-label="Lattente — inicio">
        <img src="/images/lattente-logo.png" alt="Lattente" />
      </a>
      <nav class="header-nav" aria-label="Principal">
        <a href="/#menu" data-nav="menu">Menú</a>
        <a href="/orders" data-nav="orders">Pedido</a>
        <a href="/feedback" data-nav="feedback">Feedback</a>
      </nav>
      <div class="header-actions">
        <button class="cart-btn" type="button" data-open-cart aria-label="Carrito">
          🛒
          <span class="cart-count" data-cart-count hidden>0</span>
        </button>
      </div>
    </header>

    <main class="feedback-grid">
      <section class="feedback-copy">
        <h1>Queremos que tu experiencia con nuestro servicio sea siempre la mejor.</h1>
        <hr class="section-rule" />
        <p>Ayúdanos a mejorar calificando nuestros servicios:</p>
      </section>

      <section class="feedback-form-wrap">
        <form class="panel feedback-panel" data-feedback-form>
          <h2>Tu calificación</h2>

          <div class="field">
            <label for="email">Correo</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              inputmode="email"
              placeholder="tu@correo.com"
            />
          </div>

          <div class="field">
            <label id="rating-label">¿Cómo estuvo el servicio?</label>
            <div class="feedback-faces" role="radiogroup" aria-labelledby="rating-label">
              <label title="Muy mal">
                <input type="radio" name="rating" value="1" required />
                <span aria-hidden="true">😠</span>
                <span class="visually-hidden">Muy mal</span>
              </label>
              <label title="Mal">
                <input type="radio" name="rating" value="2" />
                <span aria-hidden="true">🙁</span>
                <span class="visually-hidden">Mal</span>
              </label>
              <label title="Neutral">
                <input type="radio" name="rating" value="3" />
                <span aria-hidden="true">😐</span>
                <span class="visually-hidden">Neutral</span>
              </label>
              <label title="Bien">
                <input type="radio" name="rating" value="4" />
                <span aria-hidden="true">🙂</span>
                <span class="visually-hidden">Bien</span>
              </label>
              <label title="Excelente">
                <input type="radio" name="rating" value="5" />
                <span aria-hidden="true">😄</span>
                <span class="visually-hidden">Excelente</span>
              </label>
            </div>
          </div>

          <div class="field">
            <label for="comment">Comentario</label>
            <textarea
              id="comment"
              name="comment"
              rows="2"
              placeholder="Contanos tu experiencia…"
            ></textarea>
          </div>

          <button class="btn" type="submit">Enviar</button>
          <p class="panel-note">No envíes contraseñas ni datos sensibles.</p>
        </form>
      </section>

    </main>

    <div class="cart-drawer" data-cart-drawer>
      <div class="cart-backdrop"></div>
      <aside class="cart-panel" aria-label="Carrito">
        <div>
          <h2>Tu pedido</h2>
          <button type="button" data-close-cart class="btn" style="width:auto;margin-top:0.5rem;padding:0.4rem 0.9rem">
            Cerrar
          </button>
        </div>
        <div class="cart-list" data-cart-list></div>
        <div>
          <div class="cart-total">
            <span>Total</span>
            <span data-cart-total>0,00 Bs.</span>
          </div>
          <a class="btn" href="/orders">Ir a Pedido</a>
        </div>
      </aside>
    </div>

    <script src="/js/cart.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/feedback.js"></script>
    <script src="/js/site-footer.js"></script>
  </body>
</html>
